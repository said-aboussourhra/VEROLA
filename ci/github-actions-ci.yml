name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder so modules that read DATABASE_URL at import time can be built.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        # Existing lint debt is tracked separately; remove continue-on-error once fixed.
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
